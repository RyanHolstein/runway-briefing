<svg width="3000" height="3000" viewBox="0 0 3000 3000" xmlns="http://www.w3.org/2000/svg">
  <rect width="3000" height="3000" fill="#0a0a1a"/>

  <!-- Subtle gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="43%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="3000" height="3000" fill="url(#glow)"/>

  <!-- Radar rings — gold/amber tint for weekly -->
  <circle cx="1500" cy="1300" r="900" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.3"/>
  <circle cx="1500" cy="1300" r="650" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.4"/>
  <circle cx="1500" cy="1300" r="400" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.5"/>
  <circle cx="1500" cy="1300" r="150" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.6"/>

  <!-- Crosshairs -->
  <line x1="1500" y1="350" x2="1500" y2="2250" stroke="#f59e0b" stroke-width="1.5" opacity="0.15"/>
  <line x1="550" y1="1300" x2="2450" y2="1300" stroke="#f59e0b" stroke-width="1.5" opacity="0.15"/>

  <!-- Diagonal crosshairs -->
  <line x1="850" y1="650" x2="2150" y2="1950" stroke="#f59e0b" stroke-width="1" opacity="0.08"/>
  <line x1="2150" y1="650" x2="850" y2="1950" stroke="#f59e0b" stroke-width="1" opacity="0.08"/>

  <!-- Radar sweep line — amber -->
  <path d="M1500 1300 L1870 570" stroke="#fbbf24" stroke-width="8" opacity="0.9"/>
  <path d="M1500 1300 L1870 570 L1720 520 Z" fill="#f59e0b" opacity="0.08"/>
  <path d="M1500 1300 L1870 570 L1780 490 Z" fill="#f59e0b" opacity="0.05"/>

  <!-- Plane 1 — now cyan against the gold radar -->
  <g transform="translate(1150, 850) rotate(135) scale(5)">
    <path d="M0 -12 L-3 -2 L-14 5 L-14 7 L-3 3 L-4 12 L-8 15 L-8 17 L-2 14 L0 18 L2 14 L8 17 L8 15 L4 12 L3 3 L14 7 L14 5 L3 -2 Z" fill="#22d3ee"/>
  </g>

  <!-- Plane 2 -->
  <g transform="translate(2000, 1100) rotate(260) scale(5)">
    <path d="M0 -12 L-3 -2 L-14 5 L-14 7 L-3 3 L-4 12 L-8 15 L-8 17 L-2 14 L0 18 L2 14 L8 17 L8 15 L4 12 L3 3 L14 7 L14 5 L3 -2 Z" fill="#22d3ee"/>
  </g>

  <!-- Plane 3 -->
  <g transform="translate(1800, 1650) rotate(315) scale(4.5)">
    <path d="M0 -12 L-3 -2 L-14 5 L-14 7 L-3 3 L-4 12 L-8 15 L-8 17 L-2 14 L0 18 L2 14 L8 17 L8 15 L4 12 L3 3 L14 7 L14 5 L3 -2 Z" fill="#22d3ee"/>
  </g>

  <!-- Plane 4 -->
  <g transform="translate(1000, 1550) rotate(45) scale(4)">
    <path d="M0 -12 L-3 -2 L-14 5 L-14 7 L-3 3 L-4 12 L-8 15 L-8 17 L-2 14 L0 18 L2 14 L8 17 L8 15 L4 12 L3 3 L14 7 L14 5 L3 -2 Z" fill="#22d3ee" opacity="0.7"/>
  </g>

  <!-- Plane 5 -->
  <g transform="translate(1400, 1150) rotate(0) scale(3.5)">
    <path d="M0 -12 L-3 -2 L-14 5 L-14 7 L-3 3 L-4 12 L-8 15 L-8 17 L-2 14 L0 18 L2 14 L8 17 L8 15 L4 12 L3 3 L14 7 L14 5 L3 -2 Z" fill="#22d3ee" opacity="0.6"/>
  </g>

  <!-- Plane 6 -->
  <g transform="translate(1900, 700) rotate(200) scale(3.5)">
    <path d="M0 -12 L-3 -2 L-14 5 L-14 7 L-3 3 L-4 12 L-8 15 L-8 17 L-2 14 L0 18 L2 14 L8 17 L8 15 L4 12 L3 3 L14 7 L14 5 L3 -2 Z" fill="#22d3ee" opacity="0.5"/>
  </g>

  <!-- RUNWAY text -->
  <text x="1500" y="2420" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="330" font-weight="700" fill="#ffffff" letter-spacing="10">RUNWAY</text>

  <!-- BRIEFING text -->
  <text x="1500" y="2620" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="120" font-weight="400" fill="#fbbf24" letter-spacing="50">BRIEFING</text>

  <!-- WEEKLY DEEP DIVE badge -->
  <text x="1500" y="2780" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="70" font-weight="600" fill="#f59e0b" letter-spacing="30" opacity="0.8">WEEKLY DEEP DIVE</text>
</svg>
