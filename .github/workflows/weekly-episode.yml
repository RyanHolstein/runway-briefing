name: Weekly Deep Dive

on:
  schedule:
    # Every Friday at 14:00 UTC (10am ET) — after a full week of daily episodes
    - cron: "0 14 * * 5"
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run weekly pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_A: ${{ secrets.ELEVENLABS_VOICE_A }}
          ELEVENLABS_VOICE_B: ${{ secrets.ELEVENLABS_VOICE_B }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BUZZSPROUT_API_KEY: ${{ secrets.BUZZSPROUT_API_KEY }}
          BUZZSPROUT_PODCAST_ID: ${{ secrets.BUZZSPROUT_PODCAST_ID }}
          WEEKLY_ARTWORK_URL: ${{ secrets.WEEKLY_ARTWORK_URL }}
          PODCAST_HOST_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          SITE_DIR: "site"
        run: python weekly_pipeline.py

      - name: Check if episode was generated
        id: check
        run: |
          if [ -f skip_episode ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push new episode
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "Runway Briefing Bot"
          git config user.email "bot@runway-briefing"
          git add site/
          git commit -m "🎙️ Weekly Deep Dive $(date +%Y-%m-%d)" || echo "No changes"
          git push

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
